[project]
name = "web-searcher-backend"
version = "0.1.0"
description = "FastAPI backend that searches the web (Tavily) and writes a cited report with an LLM (Groq)."
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic-settings==2.7.1",
    "tavily-python==0.5.0",
    "groq==0.13.1",
]

[tool.uv]
package = false
